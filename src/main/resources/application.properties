spring.application.name=api-crm-altair

# Configuracion del servidor web embebido Tomcat 11
server.port=8080

# Conexion JDBC a MySQL (Base de datos: altair, Esquema predeterminado: crm)
spring.datasource.url=jdbc:mysql://localhost:3306/altair_crm?currentSchema=crm
spring.datasource.username=root
spring.datasource.password=Studium2024;
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate (Jakarta Persistence)
spring.jpa.properties.hibernate.default_schema=crm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl